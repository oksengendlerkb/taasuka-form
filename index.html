<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Form Generator</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>

    <style>
        body {
            padding-top: 1rem;
            background-color: #f8f9fa;
        }

        main {
            max-width: 600px;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        textarea {
            direction: rtl;
            text-align: right;
            height: 120px;
            margin-bottom: 1rem;
        }

        .loader {
            display: none;
            margin-top: 1rem;
            color: #10957c;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

<main class="container">

    <h1>Генератор бланков</h1>

    <form id="pdf-form">

        <label>Медицинские ограничения:</label>
        <textarea id="med_text" required></textarea>

        <label>Трудоспособность:</label>
        <textarea id="job_text" required></textarea>

        <button type="submit"
                class="contrast"
                style="width:100%;">
            Сгенерировать PDF
        </button>

    </form>

    <div id="loading-status" class="loader">
        Обработка...
    </div>

</main>

<script>

document
    .getElementById('pdf-form')
    .addEventListener('submit', generatePDF);

async function generatePDF(event) {

    event.preventDefault();

    const statusDiv =
        document.getElementById('loading-status');

    statusDiv.style.display = 'block';

    try {

        const pdfResponse =
            await fetch('./blank.pdf');

        if (!pdfResponse.ok) {
            throw new Error(
                'Файл blank.pdf не найден'
            );
        }

        const pdfBytes =
            await pdfResponse.arrayBuffer();

        const pdfDoc =
            await PDFLib.PDFDocument.load(pdfBytes);

        const form = pdfDoc.getForm();

        pdfDoc.registerFontkit(fontkit);

        const fontResponse =
            await fetch('./NotoSansHebrew-Regular.ttf');

        if (!fontResponse.ok) {
            throw new Error(
                'Не найден файл NotoSansHebrew-Regular.ttf'
            );
        }

        const fontBytes =
            await fontResponse.arrayBuffer();

        const hebrewFont =
            await pdfDoc.embedFont(fontBytes);

        const fields = form.getFields();

        const textFields =
            fields.filter(
                f => typeof f.setText === 'function'
            );

        if (textFields.length < 2) {
            throw new Error(
                'В PDF найдено менее двух текстовых полей'
            );
        }

        const medText =
            document.getElementById('med_text').value;

        const jobText =
            document.getElementById('job_text').value;

        textFields[0].setText(medText);
        textFields[1].setText(jobText);

        form.updateFieldAppearances(
            hebrewFont
        );
        
        // Эта команда убирает интерактивные поля и их синюю подсветку
        form.flatten();

        const outputBytes =
            await pdfDoc.save();

        const blob =
            new Blob(
                [outputBytes],
                {
                    type: 'application/pdf'
                }
            );

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement('a');

        link.href = url;
        link.download = 'filled_form.pdf';

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);

    }
    catch (error) {

        console.error(error);

        alert(
            'Ошибка: ' + error.message
        );
    }
    finally {

        statusDiv.style.display = 'none';
    }
}

</script>

</body>
</html>
