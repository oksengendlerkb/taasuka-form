<title>🇮🇱 Генератор бланка для службы занятости Израиля</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>

<style>
    body {
        padding-top: 1rem;

    }

</head>

<body>

<main class="container">

```
<h1>
    🇮🇱 Генератор бланка для службы занятости Израиля<br>
    Declaration of Health<br>
    הצהרת בריאות
</h1>

<form id="pdf-form">

    <label>
        Медицинские ограничения / Medical limitations / מגבלות רפואיות
    </label>

    <textarea
            id="med_text"
            required
            placeholder="Вводить только на иврите / Enter Hebrew text only / יש להזין טקסט בעברית בלבד">
    </textarea>

    <label>
        Трудоспособность / Work capability / כושר עבודה
    </label>

    <textarea
            id="job_text"
            required
            placeholder="Вводить только на иврите / Enter Hebrew text only / יש להזין טקסט בעברית בלבד">
    </textarea>

    <div class="author">
        Oksengendler Kirill, Haifa
    </div>

    <button
            type="submit"
            class="contrast"
            style="width:100%;">
        Сгенерировать PDF / Generate PDF / צור PDF
    </button>

</form>

<div id="loading-status" class="loader">
    Обработка... / Processing... / מעבד...
</div>
```

</main>

<script>

document
    .getElementById('pdf-form')
    .addEventListener('submit', generatePDF);

async function generatePDF(event) {

    event.preventDefault();

    const statusDiv =
        document.getElementById('loading-status');

    statusDiv.style.display = 'block';

    try {

        const pdfResponse =
            await fetch('./blank.pdf');

        if (!pdfResponse.ok) {
            throw new Error(
                'Файл blank.pdf не найден'
            );
        }

        const pdfBytes =
            await pdfResponse.arrayBuffer();

        const pdfDoc =
            await PDFLib.PDFDocument.load(pdfBytes);

        const form = pdfDoc.getForm();

        pdfDoc.registerFontkit(fontkit);

        const fontResponse =
            await fetch('./NotoSansHebrew-Regular.ttf');

        if (!fontResponse.ok) {
            throw new Error(
                'Не найден файл NotoSansHebrew-Regular.ttf'
            );
        }

        const fontBytes =
            await fontResponse.arrayBuffer();

        const hebrewFont =
            await pdfDoc.embedFont(fontBytes);

        const fields = form.getFields();

        const textFields =
            fields.filter(
                f => typeof f.setText === 'function'
            );

        if (textFields.length < 2) {
            throw new Error(
                'В PDF найдено менее двух текстовых полей'
            );
        }

        const medText =
            document.getElementById('med_text').value.trim();

        const jobText =
            document.getElementById('job_text').value.trim();

        textFields[0].setText(medText);
        textFields[1].setText(jobText);

        textFields[0].setFontSize(12);
        textFields[1].setFontSize(12);

        form.updateFieldAppearances(
            hebrewFont
        );

        form.flatten();

        const outputBytes =
            await pdfDoc.save();

        const blob =
            new Blob(
                [outputBytes],
                {
                    type: 'application/pdf'
                }
            );

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement('a');

        link.href = url;
        link.download = 'filled_form.pdf';

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);

    }
    catch (error) {

        console.error(error);

        alert(
            'Ошибка / Error / שגיאה: ' + error.message
        );
    }
    finally {

        statusDiv.style.display = 'none';
    }
}

</script>

</body>
</html>
