<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Form Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@0.0.2/dist/fontkit.umd.js"></script>
    
    <style>
        body { padding-top: 1rem; background-color: #f8f9fa; }
        main { max-width: 600px; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        textarea { direction: rtl; text-align: right; height: 120px; margin-bottom: 1rem; }
        .loader { display: none; margin-top: 1rem; color: #10957c; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Генератор бланков</h1>
        <form id="pdf-form" onsubmit="generatePDF(event)">
            <label>Медицинские ограничения (иврит):</label>
            <textarea id="med_text" required placeholder="Введите текст..."></textarea>
            
            <label>Трудоспособность (иврит):</label>
            <textarea id="job_text" required placeholder="Введите текст..."></textarea>
            
            <button type="submit" class="contrast" style="width: 100%;">Сгенерировать и скачать PDF</button>
        </form>
        <div id="loading-status" class="loader">Загрузка шрифтов и создание PDF...</div>
    </main>

    <script>
        async function generatePDF(event) {
            event.preventDefault();
            const statusDiv = document.getElementById('loading-status');
            statusDiv.style.display = 'block';

            try {
                // 1. Загружаем шаблон
                const existingPdfBytes = await fetch('./blank.pdf').then(res => res.arrayBuffer());
                const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);

                // 2. Подключаем Fontkit
                pdfDoc.registerFontkit(fontkit);

                // 3. Загружаем шрифт (Noto Sans Hebrew)
                const fontUrl = 'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/notosanshebrew/NotoSansHebrew-Regular.ttf';
                const fontBytes = await fetch(fontUrl).then(res => res.arrayBuffer());
                const hebrewFont = await pdfDoc.embedFont(fontBytes);

                // 4. Заполняем форму
                const form = pdfDoc.getForm();
                const fields = form.getFields();
                
                // Находим текстовые поля
                const textFields = fields.filter(f => typeof f.setText === 'function');
                
                if (textFields.length < 2) {
                    throw new Error("Не найдено достаточно полей в PDF. Проверьте blank.pdf");
                }

                // Применяем шрифт и текст к каждому полю
                textFields.forEach(field => {
                    field.setFont(hebrewFont);
                });

                textFields[0].setText(document.getElementById('med_text').value);
                textFields[1].setText(document.getElementById('job_text').value);

                // 5. Сохраняем
                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "טופס_מצהיר_חתום.pdf";
                link.click();

            } catch (error) {
                alert('Ошибка: ' + error.message);
                console.error(error);
            } finally {
                statusDiv.style.display = 'none';
            }
        }
    </script>
</body>
</html>
